<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitchr Pharmacy - Professional Ordering System</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #185FA5;
      --primary-dark: #0C447C;
      --primary-light: #E8F2FF;
      --accent: #EF9F27;
      --success: #639922;
      --danger: #E24B4A;
      --border: #E0E0E0;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-muted: #999;
      --bg: #ffffff;
      --bg-gray: #f5f7fa;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-gray);
      color: var(--text);
      line-height: 1.6;
    }

    /* HEADER / NAV */
    .header {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .header-top {
      background: #f0f0f0;
      padding: 8px 0;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-center {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 0 40px;
    }

    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.3s;
      cursor: pointer;
    }

    .nav-link:hover {
      color: var(--primary);
    }

    .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-gray);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      width: 250px;
    }

    .search-box input {
      border: none;
      background: none;
      outline: none;
      flex: 1;
      font-size: 14px;
    }

    .search-icon {
      cursor: pointer;
      color: var(--text-secondary);
    }

    .nav-icons {
      display: flex;
      gap: 20px;
      font-size: 20px;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 60px 40px;
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.95;
      margin-bottom: 20px;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(239, 159, 39, 0.3);
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid white;
    }

    .btn-secondary:hover {
      background: transparent;
      color: white;
    }

    /* CONTAINER */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 30px;
      color: var(--text);
    }

    /* TABS */
    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      background: white;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .tab-button {
      flex: 1;
      padding: 16px;
      border: none;
      background: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-secondary);
      text-align: center;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--primary-light);
    }

    .tab-button:hover {
      background: var(--bg-gray);
    }

    /* TAB CONTENT */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .product-image {
      background: linear-gradient(135deg, var(--primary-light) 0%, #E3F2FD 100%);
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      border-bottom: 1px solid var(--border);
    }

    .product-info {
      padding: 16px;
    }

    .product-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .product-category {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .product-btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .product-btn:hover {
      background: var(--primary-dark);
    }

    /* ORDER FORM */
    .order-form {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* DASHBOARD CARDS */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .dashboard-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* TABLE */
    .table-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
    }

    .table-header {
      background: var(--bg-gray);
      padding: 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
    }

    .table-content {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--bg-gray);
      padding: 14px 20px;
      text-align: left;
      font-weight: 700;
      font-size: 12px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    tr:hover {
      background: var(--bg-gray);
    }

    /* STATUS BADGE */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-pending {
      background: #fff3cd;
      color: #856404;
    }

    .badge-approved {
      background: #d4edda;
      color: #155724;
    }

    .badge-delivered {
      background: #d1ecf1;
      color: #0c5460;
    }

    /* FEATURES SECTION */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .feature-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .feature-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .feature-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .feature-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .feature-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* NOTIFICATION */
    .notification {
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .notification.success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid var(--success);
    }

    .notification.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid var(--danger);
    }

    /* FOOTER */
    footer {
      background: var(--text);
      color: white;
      padding: 40px;
      margin-top: 60px;
      text-align: center;
      font-size: 13px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .navbar {
        padding: 12px 20px;
        flex-wrap: wrap;
      }

      .nav-center {
        display: none;
      }

      .logo {
        font-size: 18px;
      }

      .search-box {
        width: 100%;
        margin-top: 10px;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 28px;
      }

      .section-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const StiтchrProfessional = () => {
      const [activeTab, setActiveTab] = useState('order');
      const [searchQuery, setSearchQuery] = useState('');
      const [notification, setNotification] = useState(null);

      const drugs = [
        { id: 1, name: 'Omeprazole', category: 'Antacid', icon: '💊', price: '$45' },
        { id: 2, name: 'Atorvastatin', category: 'Cholesterol', icon: '❤️', price: '$60' },
        { id: 3, name: 'Lisinopril', category: 'Blood Pressure', icon: '⚡', price: '$35' },
        { id: 4, name: 'Metformin', category: 'Diabetes', icon: '🩹', price: '$40' },
        { id: 5, name: 'Ibuprofen', category: 'Pain Relief', icon: '🌡️', price: '$20' },
        { id: 6, name: 'Amoxicillin', category: 'Antibiotic', icon: '🦠', price: '$55' },
      ];

      const suppliers = [
        { id: 1, name: 'Cardinal Health' },
        { id: 2, name: 'McKesson' },
        { id: 3, name: 'Henry Schein' },
        { id: 4, name: 'Anda' },
      ];

      const [orders, setOrders] = useState([
        { id: 1, drug: 'Omeprazole', qty: 500, supplier: 'Cardinal Health', status: 'DELIVERED', date: '2026-10-05' },
        { id: 2, drug: 'Atorvastatin', qty: 1000, supplier: 'McKesson', status: 'APPROVED', date: '2026-10-06' },
        { id: 3, drug: 'Lisinopril', qty: 250, supplier: 'Henry Schein', status: 'PENDING', date: '2026-10-07' },
      ]);

      const [formData, setFormData] = useState({
        drug: '',
        quantity: '',
        supplier: '',
        notes: ''
      });

      const handleInputChange = (e) => {
        setFormData({
          ...formData,
          [e.target.name]: e.target.value
        });
      };

      const handleAddToOrder = (drugName) => {
        setFormData(prev => ({ ...prev, drug: drugName }));
      };

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!formData.drug || !formData.quantity || !formData.supplier) {
          setNotification({ type: 'error', message: '❌ Please fill in all required fields' });
          return;
        }

        const newOrder = {
          id: orders.length + 1,
          drug: formData.drug,
          qty: parseInt(formData.quantity),
          supplier: suppliers.find(s => s.id === parseInt(formData.supplier))?.name,
          status: 'PENDING',
          date: new Date().toISOString().split('T')[0]
        };

        setOrders([newOrder, ...orders]);
        setFormData({ drug: '', quantity: '', supplier: '', notes: '' });
        setNotification({ type: 'success', message: '✅ Order submitted successfully!' });
        setTimeout(() => setNotification(null), 3000);
      };

      const handleApprove = (id) => {
        setOrders(orders.map(o => o.id === id ? { ...o, status: 'APPROVED' } : o));
        setNotification({ type: 'success', message: '✅ Order approved!' });
        setTimeout(() => setNotification(null), 2000);
      };

      const handleDeliver = (id) => {
        setOrders(orders.map(o => o.id === id ? { ...o, status: 'DELIVERED' } : o));
        setNotification({ type: 'success', message: '✅ Order delivered!' });
        setTimeout(() => setNotification(null), 2000);
      };

      return (
        <>
          {/* HEADER */}
          <div className="header">
            <div className="header-top">
              ✨ Free 2-week trial • No credit card required • No contracts
            </div>
            <div className="navbar">
              <div className="logo">🏥 Stitchr</div>
              <div className="nav-center">
                <span className="nav-link" onClick={() => setActiveTab('order')}>Order</span>
                <span className="nav-link" onClick={() => setActiveTab('dashboard')}>Dashboard</span>
                <span className="nav-link" onClick={() => setActiveTab('featured')}>Medications</span>
              </div>
              <div className="nav-right">
                <div className="search-box">
                  <input 
                    type="text" 
                    placeholder="Search medications..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  <span className="search-icon">🔍</span>
                </div>
                <div className="nav-icons">
                  <span title="Account">👤</span>
                  <span title="Cart">🛒</span>
                  <span title="Help">❓</span>
                </div>
              </div>
            </div>
          </div>

          {/* HERO */}
          <div className="hero">
            <h1>Pharmacy Supply Management Made Simple</h1>
            <p>One app for ordering, tracking, and managing your entire pharmaceutical inventory</p>
            <div className="hero-buttons">
              <button className="btn btn-primary">Start Free Trial</button>
              <button className="btn btn-secondary">Watch Demo</button>
            </div>
          </div>

          <div className="container">
            {notification && (
              <div className={`notification ${notification.type}`}>
                {notification.message}
              </div>
            )}

            {/* TABS */}
            <div className="tab-nav">
              <button 
                className={`tab-button ${activeTab === 'order' ? 'active' : ''}`}
                onClick={() => setActiveTab('order')}
              >
                ✏️ Place Order
              </button>
              <button 
                className={`tab-button ${activeTab === 'dashboard' ? 'active' : ''}`}
                onClick={() => setActiveTab('dashboard')}
              >
                📊 Dashboard
              </button>
              <button 
                className={`tab-button ${activeTab === 'featured' ? 'active' : ''}`}
                onClick={() => setActiveTab('featured')}
              >
                💊 Browse Medications
              </button>
              <button 
                className={`tab-button ${activeTab === 'features' ? 'active' : ''}`}
                onClick={() => setActiveTab('features')}
              >
                ⭐ Why Stitchr
              </button>
            </div>

            {/* ORDER TAB */}
            <div className={`tab-content ${activeTab === 'order' ? 'active' : ''}`}>
              <div className="order-form">
                <h2 className="section-title">📝 Submit New Order</h2>
                <form onSubmit={handleSubmitOrder}>
                  <div className="form-group">
                    <label className="form-label">Select Medication *</label>
                    <select 
                      className="form-select"
                      name="drug"
                      value={formData.drug}
                      onChange={handleInputChange}
                      required
                    >
                      <option value="">Choose a medication...</option>
                      {drugs.map(d => (
                        <option key={d.id} value={d.name}>{d.icon} {d.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Quantity (units) *</label>
                      <input 
                        type="number"
                        className="form-input"
                        name="quantity"
                        value={formData.quantity}
                        onChange={handleInputChange}
                        placeholder="Enter quantity"
                        required
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Select Supplier *</label>
                      <select 
                        className="form-select"
                        name="supplier"
                        value={formData.supplier}
                        onChange={handleInputChange}
                        required
                      >
                        <option value="">Choose supplier...</option>
                        {suppliers.map(s => (
                          <option key={s.id} value={s.id}>{s.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Special Instructions (optional)</label>
                    <textarea 
                      className="form-textarea"
                      name="notes"
                      value={formData.notes}
                      onChange={handleInputChange}
                      placeholder="Add any special instructions..."
                      rows="3"
                    />
                  </div>

                  <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '14px' }}>
                    Submit Order
                  </button>
                </form>
              </div>

              <h2 className="section-title">📋 Recent Orders</h2>
              <div className="table-section">
                <div className="table-header">Your Orders ({orders.length})</div>
                <div className="table-content">
                  <table>
                    <thead>
                      <tr>
                        <th>Medication</th>
                        <th>Qty</th>
                        <th>Supplier</th>
                        <th>Status</th>
                        <th>Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      {orders.map(order => (
                        <tr key={order.id}>
                          <td><strong>{order.drug}</strong></td>
                          <td>{order.qty}</td>
                          <td>{order.supplier}</td>
                          <td><span className={`badge badge-${order.status.toLowerCase()}`}>{order.status}</span></td>
                          <td>{order.date}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* DASHBOARD TAB */}
            <div className={`tab-content ${activeTab === 'dashboard' ? 'active' : ''}`}>
              <h2 className="section-title">📊 Order Management Dashboard</h2>
              
              <div className="dashboard-grid">
                <div className="dashboard-card">
                  <div className="card-icon">📦</div>
                  <div className="card-label">Total Orders</div>
                  <div className="card-value">{orders.length}</div>
                  <div className="card-desc">All time</div>
                </div>

                <div className="dashboard-card">
                  <div className="card-icon">✅</div>
                  <div className="card-label">Pending Review</div>
                  <div className="card-value">{orders.filter(o => o.status === 'PENDING').length}</div>
                  <div className="card-desc">Awaiting approval</div>
                </div>

                <div className="dashboard-card">
                  <div className="card-icon">🚀</div>
                  <div className="card-label">Approved</div>
                  <div className="card-value">{orders.filter(o => o.status === 'APPROVED').length}</div>
                  <div className="card-desc">In transit</div>
                </div>

                <div className="dashboard-card">
                  <div className="card-icon">🎉</div>
                  <div className="card-label">Delivered</div>
                  <div className="card-value">{orders.filter(o => o.status === 'DELIVERED').length}</div>
                  <div className="card-desc">In inventory</div>
                </div>
              </div>

              <h2 className="section-title">⏳ Pending Orders</h2>
              <div className="table-section">
                <div className="table-header">Approve Orders</div>
                <div className="table-content">
                  <table>
                    <thead>
                      <tr>
                        <th>Medication</th>
                        <th>Qty</th>
                        <th>Supplier</th>
                        <th>Date</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {orders.filter(o => o.status === 'PENDING').map(order => (
                        <tr key={order.id}>
                          <td>{order.drug}</td>
                          <td>{order.qty}</td>
                          <td>{order.supplier}</td>
                          <td>{order.date}</td>
                          <td>
                            <button 
                              className="btn btn-primary"
                              style={{ padding: '8px 16px', fontSize: '12px' }}
                              onClick={() => handleApprove(order.id)}
                            >
                              Approve
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <h2 className="section-title">🚚 Approved Orders</h2>
              <div className="table-section">
                <div className="table-header">Confirm Delivery</div>
                <div className="table-content">
                  <table>
                    <thead>
                      <tr>
                        <th>Medication</th>
                        <th>Qty</th>
                        <th>Supplier</th>
                        <th>Status</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {orders.filter(o => o.status === 'APPROVED').map(order => (
                        <tr key={order.id}>
                          <td>{order.drug}</td>
                          <td>{order.qty}</td>
                          <td>{order.supplier}</td>
                          <td><span className="badge badge-approved">APPROVED</span></td>
                          <td>
                            <button 
                              className="btn btn-primary"
                              style={{ padding: '8px 16px', fontSize: '12px' }}
                              onClick={() => handleDeliver(order.id)}
                            >
                              Delivered
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* MEDICATIONS TAB */}
            <div className={`tab-content ${activeTab === 'featured' ? 'active' : ''}`}>
              <h2 className="section-title">💊 Popular Medications</h2>
              <div className="product-grid">
                {drugs.filter(d => 
                  d.name.toLowerCase().includes(searchQuery.toLowerCase())
                ).map(drug => (
                  <div key={drug.id} className="product-card">
                    <div className="product-image">{drug.icon}</div>
                    <div className="product-info">
                      <div className="product-name">{drug.name}</div>
                      <div className="product-category">{drug.category}</div>
                      <div className="product-price">{drug.price}/unit</div>
                      <button 
                        className="product-btn"
                        onClick={() => handleAddToOrder(drug.name)}
                      >
                        Add to Order
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* FEATURES TAB */}
            <div className={`tab-content ${activeTab === 'features' ? 'active' : ''}`}>
              <h2 className="section-title">⭐ Why Choose Stitchr?</h2>
              <div className="features-grid">
                <div className="feature-item">
                  <div className="feature-icon">📝</div>
                  <div className="feature-title">Simple Ordering</div>
                  <div className="feature-desc">Order from multiple suppliers in one place. No emails or spreadsheets.</div>
                </div>

                <div className="feature-item">
                  <div className="feature-icon">📊</div>
                  <div className="feature-title">Real-time Dashboard</div>
                  <div className="feature-desc">Track all orders, inventory, and spending instantly.</div>
                </div>

                <div className="feature-item">
                  <div className="feature-icon">🚀</div>
                  <div className="feature-title">Fast Setup</div>
                  <div className="feature-desc">Get started in 60 minutes. No training required.</div>
                </div>

                <div className="feature-item">
                  <div className="feature-icon">💰</div>
                  <div className="feature-title">Save Time & Money</div>
                  <div className="feature-desc">Save 3-5 hours per week on administrative tasks.</div>
                </div>

                <div className="feature-item">
                  <div className="feature-icon">🔔</div>
                  <div className="feature-title">Slack Integration</div>
                  <div className="feature-desc">Get instant notifications when orders are placed or delivered.</div>
                </div>

                <div className="feature-item">
                  <div className="feature-icon">🛡️</div>
                  <div className="feature-title">Secure & Reliable</div>
                  <div className="feature-desc">Enterprise-grade security with daily backups.</div>
                </div>
              </div>

              <div className="order-form" style={{ marginTop: '40px', textAlign: 'center' }}>
                <h2 style={{ marginBottom: '20px' }}>Ready to Get Started?</h2>
                <p style={{ marginBottom: '20px', color: 'var(--text-secondary)' }}>
                  Join hundreds of independent pharmacies already using Stitchr to streamline their operations.
                </p>
                <button className="btn btn-primary" style={{ fontSize: '16px', padding: '16px 40px' }}>
                  Start Your Free Trial Today
                </button>
              </div>
            </div>
          </div>

          {/* FOOTER */}
          <footer>
            <p>© 2026 Stitchr - Pharmacy Supply Management Platform</p>
            <p>Making pharmacy operations simple, efficient, and predictable</p>
          </footer>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<StiтchrProfessional />);
  </script>
</body>
</html>

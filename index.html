<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitchr Pharmacy MVP - Interactive Prototype</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #185FA5;
      --primary-dark: #0C447C;
      --accent: #EF9F27;
      --success: #639922;
      --danger: #E24B4A;
      --border: #E0E0E0;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-muted: #999;
      --bg: #ffffff;
      --bg-gray: #f8f8f8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 30px 20px;
      margin: -20px -20px 30px -20px;
      border-radius: 0 0 12px 12px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 14px;
      opacity: 0.95;
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
    }

    .tab-button {
      padding: 12px 24px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-button:hover {
      color: var(--text);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Pharmacy Tech View */
    .form-section {
      background: var(--bg-gray);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .form-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #4a7319;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: #c93939;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 12px;
    }

    /* Notifications */
    .notification {
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .notification.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid var(--success);
    }

    .notification.info {
      background: #e3f2fd;
      color: #1565c0;
      border-left: 4px solid var(--primary);
    }

    .notification.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid var(--danger);
    }

    /* Tables */
    .table-container {
      background: white;
      border-radius: 12px;
      border: 2px solid var(--border);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--bg-gray);
      padding: 16px;
      text-align: left;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }

    tr:hover {
      background: var(--bg-gray);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-approved {
      background: #d4edda;
      color: #155724;
    }

    .status-delivered {
      background: #d1ecf1;
      color: #0c5460;
    }

    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }

    /* Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid var(--border);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .card-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Inventory */
    .inventory-item {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 2px solid var(--border);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inventory-info {
      flex: 1;
    }

    .inventory-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .inventory-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .inventory-quantity {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      min-width: 80px;
      text-align: right;
    }

    .low-stock {
      border-left: 4px solid var(--danger);
      background: #fff5f5;
    }

    /* Success Message */
    .success-message {
      text-align: center;
      padding: 40px;
      background: var(--bg-gray);
      border-radius: 12px;
      margin: 20px 0;
    }

    .success-message h3 {
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--success);
    }

    .success-message p {
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }

      td, th {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const StiтchrPharmacyPrototype = () => {
      const [activeTab, setActiveTab] = useState('tech');
      const [drugs] = useState([
        { id: 1, name: 'Omeprazole', category: 'Antacid' },
        { id: 2, name: 'Atorvastatin', category: 'Cholesterol' },
        { id: 3, name: 'Lisinopril', category: 'Blood Pressure' },
        { id: 4, name: 'Metformin', category: 'Diabetes' },
        { id: 5, name: 'Ibuprofen', category: 'Pain Relief' },
        { id: 6, name: 'Amoxicillin', category: 'Antibiotic' },
      ]);

      const [suppliers] = useState([
        { id: 1, name: 'Cardinal Health' },
        { id: 2, name: 'McKesson' },
        { id: 3, name: 'Henry Schein' },
        { id: 4, name: 'Anda' },
      ]);

      const [orders, setOrders] = useState([
        { id: 1, drug: 'Omeprazole', qty: 500, supplier: 'Cardinal Health', status: 'DELIVERED', cost: 350, date: '2026-10-05' },
        { id: 2, drug: 'Atorvastatin', qty: 1000, supplier: 'McKesson', status: 'APPROVED', cost: 500, date: '2026-10-06' },
        { id: 3, drug: 'Lisinopril', qty: 250, supplier: 'Henry Schein', status: 'PENDING', cost: 175, date: '2026-10-07' },
      ]);

      const [inventory, setInventory] = useState([
        { id: 1, drug: 'Omeprazole', qty: 500, reorder: 100 },
        { id: 2, drug: 'Atorvastatin', qty: 25, reorder: 200 },
        { id: 3, drug: 'Lisinopril', qty: 180, reorder: 150 },
        { id: 4, drug: 'Metformin', qty: 350, reorder: 200 },
      ]);

      const [formData, setFormData] = useState({
        drug: '',
        quantity: '',
        supplier: '',
        notes: '',
      });

      const [notification, setNotification] = useState(null);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: value
        }));
      };

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        
        if (!formData.drug || !formData.quantity || !formData.supplier) {
          setNotification({
            type: 'error',
            message: '❌ Please fill in all required fields'
          });
          return;
        }

        const newOrder = {
          id: orders.length + 1,
          drug: formData.drug,
          qty: parseInt(formData.quantity),
          supplier: suppliers.find(s => s.id === parseInt(formData.supplier))?.name,
          status: 'PENDING',
          cost: 0,
          date: new Date().toISOString().split('T')[0]
        };

        setOrders([newOrder, ...orders]);
        setFormData({ drug: '', quantity: '', supplier: '', notes: '' });
        
        setNotification({
          type: 'success',
          message: '✓ Order submitted! Admin will review and approve.'
        });

        setTimeout(() => setNotification(null), 3000);
      };

      const handleApproveOrder = (id) => {
        setOrders(orders.map(order => 
          order.id === id ? { ...order, status: 'APPROVED' } : order
        ));
        setNotification({
          type: 'success',
          message: '✓ Order approved! Notification sent to Slack.'
        });
        setTimeout(() => setNotification(null), 2000);
      };

      const handleDeliverOrder = (id) => {
        const order = orders.find(o => o.id === id);
        setOrders(orders.map(o => 
          o.id === id ? { ...o, status: 'DELIVERED' } : o
        ));
        
        // Update inventory
        setInventory(inventory.map(inv => 
          inv.drug === order.drug ? { ...inv, qty: inv.qty + order.qty } : inv
        ));

        setNotification({
          type: 'success',
          message: `✓ Order delivered! Inventory updated (+${order.qty} ${order.drug})`
        });
        setTimeout(() => setNotification(null), 2000);
      };

      const totalSpend = orders.filter(o => o.cost > 0).reduce((sum, o) => sum + o.cost, 0);
      const totalOrders = orders.length;
      const approvedOrders = orders.filter(o => o.status === 'APPROVED').length;
      const deliveredOrders = orders.filter(o => o.status === 'DELIVERED').length;

      const getStatusColor = (status) => {
        switch(status) {
          case 'PENDING': return 'status-pending';
          case 'APPROVED': return 'status-approved';
          case 'DELIVERED': return 'status-delivered';
          case 'REJECTED': return 'status-rejected';
          default: return '';
        }
      };

      return (
        <div className="container">
          <header>
            <h1>🏥 Stitchr Pharmacy MVP</h1>
            <p>Interactive Prototype • Test the order tracking system • Pharmacy Tech + Admin Views</p>
          </header>

          <div className="tab-nav">
            <button 
              className={`tab-button ${activeTab === 'tech' ? 'active' : ''}`}
              onClick={() => setActiveTab('tech')}
            >
              👩‍💻 Pharmacy Tech (Place Order)
            </button>
            <button 
              className={`tab-button ${activeTab === 'admin' ? 'active' : ''}`}
              onClick={() => setActiveTab('admin')}
            >
              📊 Admin Dashboard
            </button>
            <button 
              className={`tab-button ${activeTab === 'inventory' ? 'active' : ''}`}
              onClick={() => setActiveTab('inventory')}
            >
              📦 Inventory Tracking
            </button>
          </div>

          {/* PHARMACY TECH VIEW */}
          <div className={`tab-content ${activeTab === 'tech' ? 'active' : ''}`}>
            {notification && (
              <div className={`notification ${notification.type}`}>
                {notification.message}
              </div>
            )}

            <div className="form-section">
              <h2>Submit New Order</h2>
              <form onSubmit={handleSubmitOrder}>
                <div className="form-group">
                  <label>Drug/Medication *</label>
                  <select 
                    name="drug" 
                    value={formData.drug}
                    onChange={handleInputChange}
                    required
                  >
                    <option value="">Select a drug...</option>
                    {drugs.map(drug => (
                      <option key={drug.id} value={drug.name}>
                        {drug.name} ({drug.category})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label>Quantity (units) *</label>
                    <input 
                      type="number" 
                      name="quantity"
                      value={formData.quantity}
                      onChange={handleInputChange}
                      placeholder="e.g., 500"
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>Supplier *</label>
                    <select 
                      name="supplier"
                      value={formData.supplier}
                      onChange={handleInputChange}
                      required
                    >
                      <option value="">Select supplier...</option>
                      {suppliers.map(supplier => (
                        <option key={supplier.id} value={supplier.id}>
                          {supplier.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label>Notes (optional)</label>
                  <textarea 
                    name="notes"
                    value={formData.notes}
                    onChange={handleInputChange}
                    placeholder="Any special instructions..."
                    rows="3"
                  />
                </div>

                <button type="submit" className="btn-primary">
                  Submit Order
                </button>
              </form>
            </div>

            <div className="form-section">
              <h2>Your Recent Orders</h2>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Drug</th>
                      <th>Quantity</th>
                      <th>Supplier</th>
                      <th>Status</th>
                      <th>Date Submitted</th>
                    </tr>
                  </thead>
                  <tbody>
                    {orders.map(order => (
                      <tr key={order.id}>
                        <td>{order.drug}</td>
                        <td>{order.qty} units</td>
                        <td>{order.supplier}</td>
                        <td>
                          <span className={`status-badge ${getStatusColor(order.status)}`}>
                            {order.status}
                          </span>
                        </td>
                        <td>{order.date}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* ADMIN DASHBOARD */}
          <div className={`tab-content ${activeTab === 'admin' ? 'active' : ''}`}>
            <div className="dashboard-grid">
              <div className="card">
                <div className="card-label">Total Orders</div>
                <div className="card-value">{totalOrders}</div>
                <div className="card-desc">All time submitted</div>
              </div>

              <div className="card">
                <div className="card-label">Approved Orders</div>
                <div className="card-value">{approvedOrders}</div>
                <div className="card-desc">Waiting for delivery</div>
              </div>

              <div className="card">
                <div className="card-label">Delivered Orders</div>
                <div className="card-value">{deliveredOrders}</div>
                <div className="card-desc">In inventory</div>
              </div>

              <div className="card">
                <div className="card-label">Total Spend</div>
                <div className="card-value">${totalSpend.toLocaleString()}</div>
                <div className="card-desc">This month</div>
              </div>
            </div>

            <div className="form-section">
              <h2>Pending Orders (Review & Approve)</h2>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Drug</th>
                      <th>Qty</th>
                      <th>Supplier</th>
                      <th>Cost</th>
                      <th>Date</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {orders.filter(o => o.status === 'PENDING').map(order => (
                      <tr key={order.id}>
                        <td><strong>{order.drug}</strong></td>
                        <td>{order.qty}</td>
                        <td>{order.supplier}</td>
                        <td>
                          <input 
                            type="number" 
                            value={order.cost}
                            onChange={(e) => setOrders(orders.map(o => 
                              o.id === order.id ? { ...o, cost: parseInt(e.target.value) || 0 } : o
                            ))}
                            placeholder="$"
                            style={{ width: '80px' }}
                          />
                        </td>
                        <td>{order.date}</td>
                        <td>
                          <button 
                            className="btn-success btn-small"
                            onClick={() => handleApproveOrder(order.id)}
                          >
                            Approve
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {orders.filter(o => o.status === 'PENDING').length === 0 && (
                  <div style={{ padding: '20px', textAlign: 'center', color: 'var(--text-muted)' }}>
                    No pending orders
                  </div>
                )}
              </div>
            </div>

            <div className="form-section">
              <h2>Approved Orders (Confirm Delivery)</h2>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Drug</th>
                      <th>Qty</th>
                      <th>Supplier</th>
                      <th>Cost</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {orders.filter(o => o.status === 'APPROVED').map(order => (
                      <tr key={order.id}>
                        <td><strong>{order.drug}</strong></td>
                        <td>{order.qty}</td>
                        <td>{order.supplier}</td>
                        <td>${order.cost}</td>
                        <td>
                          <span className="status-badge status-approved">APPROVED</span>
                        </td>
                        <td>
                          <button 
                            className="btn-primary btn-small"
                            onClick={() => handleDeliverOrder(order.id)}
                          >
                            Mark Delivered
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {orders.filter(o => o.status === 'APPROVED').length === 0 && (
                  <div style={{ padding: '20px', textAlign: 'center', color: 'var(--text-muted)' }}>
                    No approved orders
                  </div>
                )}
              </div>
            </div>

            <div className="form-section">
              <h2>Delivered Orders (History)</h2>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Drug</th>
                      <th>Qty</th>
                      <th>Supplier</th>
                      <th>Cost</th>
                      <th>Date Delivered</th>
                    </tr>
                  </thead>
                  <tbody>
                    {orders.filter(o => o.status === 'DELIVERED').map(order => (
                      <tr key={order.id}>
                        <td><strong>{order.drug}</strong></td>
                        <td>{order.qty}</td>
                        <td>{order.supplier}</td>
                        <td>${order.cost}</td>
                        <td>{order.date}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* INVENTORY */}
          <div className={`tab-content ${activeTab === 'inventory' ? 'active' : ''}`}>
            <div className="dashboard-grid">
              <div className="card">
                <div className="card-label">Items in Stock</div>
                <div className="card-value">{inventory.length}</div>
                <div className="card-desc">Different drugs</div>
              </div>

              <div className="card">
                <div className="card-label">Low Stock Alerts</div>
                <div className="card-value" style={{ color: 'var(--danger)' }}>
                  {inventory.filter(i => i.qty < i.reorder).length}
                </div>
                <div className="card-desc">Need reordering</div>
              </div>

              <div className="card">
                <div className="card-label">Total Units</div>
                <div className="card-value">
                  {inventory.reduce((sum, i) => sum + i.qty, 0).toLocaleString()}
                </div>
                <div className="card-desc">In inventory</div>
              </div>
            </div>

            <div className="form-section">
              <h2>Current Inventory Levels</h2>
              {inventory.map(item => {
                const isLowStock = item.qty < item.reorder;
                return (
                  <div key={item.id} className={`inventory-item ${isLowStock ? 'low-stock' : ''}`}>
                    <div className="inventory-info">
                      <div className="inventory-name">{item.drug}</div>
                      <div className="inventory-status">
                        Reorder level: {item.reorder} units
                        {isLowStock && ' • 🔴 LOW STOCK'}
                      </div>
                    </div>
                    <div className="inventory-quantity">
                      {item.qty} <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>units</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="form-section" style={{ marginTop: '30px' }}>
              <h2>How Inventory Works</h2>
              <p style={{ marginBottom: '15px', color: 'var(--text-secondary)' }}>
                When you submit an order as a pharmacy tech:
              </p>
              <ul style={{ marginLeft: '20px', color: 'var(--text-secondary)', lineHeight: '2' }}>
                <li>✓ Admin reviews and approves</li>
                <li>✓ Supplier delivers to pharmacy</li>
                <li>✓ Admin marks order as delivered</li>
                <li>✓ Inventory automatically updates</li>
                <li>✓ If quantity drops below reorder level → Low stock alert</li>
